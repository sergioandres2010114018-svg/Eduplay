<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13235B">
<meta name="description" content="EduPlay: app educativa gamificada para estudiantes de 9°, 10° y 11°. Aprende jugando, supera cada reto.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>EduPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de una columna tipo móvil (máx 560px) con barra inferior fija; login a pantalla completa con foto/composición de fondo */
:root{
  --navy:#13235B; --blue:#1E6FD9; --green:#4FA52E; --yellow:#F2B400; --red:#E0352B;
  --bg:#F3F6FC; --surface:#FFFFFF; --surface-2:#E8EEF9; --line:#D3DCEE;
  --fg:#13203F; --muted:#5A6788; --on-accent:#FFFFFF;
  --ok-bg:#E3F4DA; --ok-fg:#2D6E14; --bad-bg:#FDE4E2; --bad-fg:#A3241C;
  --nav-bg:#FFFFFF;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  --foto-login:none; /* Reemplazar por url("…") con la foto del fondo del login */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1430; --surface:#14204A; --surface-2:#1B2A5C; --line:#2A3B74;
  --fg:#EAF0FF; --muted:#A3B1D6; --blue:#4D92F0; --green:#6CC248;
  --ok-bg:#183D17; --ok-fg:#A8E08C; --bad-bg:#4A1A1A; --bad-fg:#FFB0A8; --nav-bg:#111B40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1430; --surface:#14204A; --surface-2:#1B2A5C; --line:#2A3B74;
  --fg:#EAF0FF; --muted:#A3B1D6; --blue:#4D92F0; --green:#6CC248;
  --ok-bg:#183D17; --ok-fg:#A8E08C; --bad-bg:#4A1A1A; --bad-fg:#FFB0A8; --nav-bg:#111B40; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:600}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* ---------- LOGIN ---------- */
#auth{min-height:100%;position:relative;display:grid;place-items:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;background:#0E1A45;color:#EAF0FF}
.auth-bg{position:absolute;inset:0;z-index:0;
  background:
    linear-gradient(180deg,rgba(10,20,55,.55),rgba(10,20,55,.88)),
    var(--foto-login),
    radial-gradient(60% 50% at 12% 18%,rgba(30,111,217,.75),transparent 70%),
    radial-gradient(50% 45% at 92% 12%,rgba(79,165,46,.6),transparent 70%),
    radial-gradient(45% 40% at 85% 92%,rgba(242,180,0,.45),transparent 70%),
    radial-gradient(40% 35% at 5% 95%,rgba(224,53,43,.4),transparent 70%),
    #0E1A45;
  background-size:cover;background-position:center}
.auth-bg canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.auth-card{position:relative;z-index:1;width:100%;max-width:420px;background:rgba(255,255,255,.97);color:#13203F;border-radius:22px;padding:24px 22px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.auth-logo{display:block;width:150px;margin:-4px auto 6px}
.slogan{text-align:center;font-family:var(--f-display);color:#13235B;font-weight:600;font-size:1rem;margin-bottom:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E8EEF9;border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:#5A6788}
.seg button[aria-selected="true"]{background:#fff;color:#13235B;box-shadow:0 1px 3px rgba(19,35,91,.2)}
.form{display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-weight:600;font-size:.88rem}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid #CBD5EA;border-radius:var(--r-sm);background:#fff;color:#13203F}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#1E6FD9;outline:none;box-shadow:0 0 0 3px rgba(30,111,217,.18)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:.82rem;color:#4A5675}
.check input{margin-top:3px;accent-color:#1E6FD9}
.msg{font-size:.88rem;padding:9px 11px;border-radius:var(--r-sm)}
.msg.err{background:#FDE4E2;color:#A3241C}
.msg.ok{background:#E3F4DA;color:#2D6E14}
.auth-foot{position:relative;z-index:1;text-align:center;font-size:.78rem;color:rgba(234,240,255,.8);margin-top:14px;max-width:420px}
.auth-wrap{display:grid;justify-items:center;width:100%}

/* ---------- BOTONES ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--blue);color:var(--on-accent);text-decoration:none;box-shadow:0 3px 0 rgba(19,35,91,.35);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(19,35,91,.35)}
.btn.green{background:var(--green)} .btn.yellow{background:var(--yellow);color:#13203F} .btn.red{background:var(--red)}
.btn.ghost{background:var(--surface-2);color:var(--fg);box-shadow:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.auth-card .btn{background:#1E6FD9}

/* ---------- APP SHELL ---------- */
#app{min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#13235B}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top img{width:38px;height:34px;object-fit:cover;border-radius:9px;background:#fff}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:.01em}
.brand b{color:#7CD455;font-weight:700}
.pts{margin-left:auto;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:999px;font-size:.85rem}
.pts .star{color:var(--yellow)}
main{max-width:560px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav-bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:transparent;padding:8px 2px 9px;display:grid;justify-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted)}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] svg{stroke-width:2.4}

/* ---------- COMPONENTES ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.hero{background:linear-gradient(135deg,var(--navy),#1C3A8F);color:#fff;border-radius:18px;padding:18px;display:grid;gap:12px;position:relative;overflow:hidden}
.hero .lv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero .lvname{font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow));border-radius:inherit}
.bar.light{background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:grid;gap:6px;align-content:start;min-width:0}
.tile .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:21px;height:21px}
.tile strong{font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.area-mat{--ac:#1E6FD9} .area-fis{--ac:#7A4FD9} .area-lec{--ac:#E0352B} .area-soc{--ac:#3E9A22}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.86rem;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}}
.topic{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.topic .dot{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none}
.topic .tx{min-width:0;flex:1}
.topic .seen{font-size:.72rem;font-weight:700;color:var(--ok-fg);background:var(--ok-bg);padding:3px 8px;border-radius:999px}
.sheet{border-left:5px solid var(--ac);}
.example{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;font-size:.92rem}
.links{display:flex;flex-wrap:wrap;gap:8px}
.link{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--surface-2);color:var(--fg);font-weight:600;font-size:.85rem;text-decoration:none;border:1px solid var(--line)}
.link svg{width:16px;height:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ctx{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;font-size:.92rem;border-left:3px solid var(--muted)}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;color:var(--fg)}
.opt .k{font-family:var(--f-mono);font-weight:700;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:.85rem}
.opt.sel{border-color:var(--blue)} .opt.sel .k{background:var(--blue);color:#fff}
.opt.right{border-color:var(--green);background:var(--ok-bg)} .opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--bad-bg)} .opt.wrong .k{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px}
.fb.ok{background:var(--ok-bg);color:var(--ok-fg)} .fb.bad{background:var(--bad-bg);color:var(--bad-fg)}
.fb p{color:var(--fg);margin-top:4px}
.timer{font-family:var(--f-mono);font-weight:700;background:var(--navy);color:#fff;border-radius:10px;padding:6px 10px}
.timer.low{background:var(--red)}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.8rem;color:var(--fg)}
.qnav button.done{background:var(--surface-2);border-color:var(--blue)}
.qnav button.cur{background:var(--blue);color:#fff;border-color:var(--blue)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{display:grid;justify-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.badge .medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--bc,#999)}
.badge .medal svg{width:24px;height:24px}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge strong{font-size:.8rem;line-height:1.2}
.badge span{font-size:.7rem;color:var(--muted);line-height:1.25}
.arow{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-size:.88rem}
.rank{display:grid;gap:6px}
.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;background:var(--surface-2)}
.rank li.me{outline:2px solid var(--blue)}
.rank ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pos{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.avatar{width:58px;height:58px;border-radius:16px;background:var(--yellow);color:#13203F;font-family:var(--f-display);font-weight:700;font-size:1.5rem;display:grid;place-items:center;flex:none}
.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.media{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);display:grid;min-width:0}
.media img,.media video{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2);display:block;max-width:100%}
.media .mb{padding:9px 10px;display:grid;gap:3px;min-width:0}
.media .mb strong{font-size:.86rem;line-height:1.25;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.lnk{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--fg);min-width:0}
.lnk .lic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none;color:var(--blue)}
.lnk .lic svg{width:20px;height:20px}
.lnk .tx{min-width:0;display:grid;gap:2px}
.lnk .tx strong{font-size:.92rem;overflow-wrap:anywhere}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:.9rem}
.tutor-out{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:12px;font-size:.93rem;min-height:60px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-mono);font-size:1.35rem}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.fact .big{font-family:var(--f-mono);font-weight:700;font-size:1.6rem;color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:20;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.inline-form{display:grid;gap:10px}
.inline-form .field label{color:var(--fg)}
.inline-form .field input,.inline-form .field select,.inline-form .field textarea{background:var(--surface);color:var(--fg);border-color:var(--line)}
details.card summary{cursor:pointer;font-weight:700;font-family:var(--f-display);font-size:1.02rem}
@media (max-width:380px){.badges{grid-template-columns:repeat(2,minmax(0,1fr))}.arow{grid-template-columns:90px 1fr 42px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:.6}100%{transform:none;opacity:1}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>
<script src="js/config.js"></script>
</head>
<body>
<!-- ================= LOGIN / REGISTRO ================= -->
<section id="auth">
  <div class="auth-bg" aria-hidden="true"><canvas id="bgfx"></canvas></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <img class="auth-logo" src="assets/logo.jpg" alt="EduPlay">
      <p class="slogan">Aprende jugando, supera cada reto</p>
      <div class="seg" role="tablist">
        <button id="tab-login" role="tab" aria-selected="true">Iniciar sesión</button>
        <button id="tab-reg" role="tab" aria-selected="false">Registrarse</button>
      </div>

      <form id="f-login" class="form" novalidate>
        <div class="field"><label for="l-user">Usuario</label><input id="l-user" autocomplete="username" placeholder="ej. ana.tovar" required></div>
        <div class="field"><label for="l-pass">Contraseña</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
        <div id="l-msg" class="msg" hidden></div>
        <button class="btn block" id="l-btn" type="submit">Entrar</button>
        <p class="small" style="text-align:center;color:#5A6788">¿No tienes cuenta? <a href="#" id="go-reg" style="color:#1E6FD9;font-weight:700">Regístrate gratis</a></p>
      </form>

      <form id="f-reg" class="form" novalidate hidden>
        <div class="field"><label for="r-name">Nombre completo</label><input id="r-name" autocomplete="name" required></div>
        <div class="row2">
          <div class="field"><label for="r-user">Usuario</label><input id="r-user" autocomplete="username" placeholder="3 a 20 letras" required></div>
          <div class="field"><label for="r-grado">Grado</label>
            <select id="r-grado"><option value="9">9°</option><option value="10">10°</option><option value="11" selected>11°</option></select></div>
        </div>
        <div class="field"><label for="r-inst">Institución educativa</label><input id="r-inst" value="I.E.T.D. Pijiño del Carmen"></div>
        <div class="row2">
          <div class="field"><label for="r-pass">Contraseña</label><input id="r-pass" type="password" autocomplete="new-password" placeholder="mín. 6" required></div>
          <div class="field"><label for="r-pass2">Repetir</label><input id="r-pass2" type="password" autocomplete="new-password" required></div>
        </div>
        <label class="check"><input type="checkbox" id="r-ok"> <span>Autorizo el tratamiento de mis datos según la Ley 1581 de 2012. Si soy menor de edad, cuento con la autorización de mi acudiente.</span></label>
        <div id="r-msg" class="msg" hidden></div>
        <button class="btn block green" id="r-btn" type="submit">Crear mi cuenta</button>
      </form>
    </div>
    <p class="auth-foot">Proyecto SENATIC · Centro Acuícola y Agroindustrial de Gaira · Pijiño del Carmen, Magdalena</p>
  </div>
</section>

<!-- ================= APP ================= -->
<div id="app" hidden>
  <header class="top"><div class="top-in">
    <img src="assets/icon.jpg" alt="">
    <span class="brand">Edu<b>Play</b></span>
    <span class="pts mono"><span class="star">★</span><span id="hdr-pts">0</span> pts · N<span id="hdr-lv">1</span></span>
  </div></header>
  <main id="view"></main>
  <nav class="nav" aria-label="Secciones"><div class="nav-in">
    <button data-go="inicio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>

const FB_VER="10.12.2";
function cargarScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
let fbStorage=null;
async function fbInit(){
  try{
    for(const m of ["app","auth","firestore","storage"]) await cargarScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
    firebase.initializeApp(window.FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    try{ fbStorage=firebase.storage(); }catch(e){ fbStorage=null; }
    return firebase.firestore();
  }catch(e){ console.warn("Firebase no disponible, se usa modo local", e); return null; }
}

const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const normUser = u => String(u||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9_-]/g,"");
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function salt(){const a=new Uint8Array(12);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,"0")).join("")}

async function leerUsuario(id){
  const db = await dbReady;
  if (db){ try{ const s = await db.doc("usuarios/"+id).get(); if (s.exists) return {u:structuredClone(s.data()),origen:"nube"}; }catch(e){} }
  const loc = LS.get("eduplay_usuarios",{})[id];
  return loc ? {u:loc,origen:"local"} : null;
}
async function guardarUsuario(u, origen){
  const db = S.db;
  if (db && origen !== "local"){
    try{ await db.doc("usuarios/"+u.id).set(u); return "nube"; }catch(e){ console.warn("db", e && e.code); if (origen==="nube") throw e; }
  }
  const all = LS.get("eduplay_usuarios",{}); all[u.id]=u;
  if (!LS.set("eduplay_usuarios",all)) throw new Error("storage");
  return "local";
}

function showMsg(el,txt,kind="err"){el.textContent=txt;el.className="msg "+kind;el.hidden=false}

$("#f-reg").addEventListener("submit", async e => {
  e.preventDefault(); const m=$("#r-msg"); m.hidden=true;
  const nombre=$("#r-name").value.trim(), id=normUser($("#r-user").value), p=$("#r-pass").value, p2=$("#r-pass2").value;
  if (nombre.length<3) return showMsg(m,"Escribe tu nombre completo.");
  if (id.length<3||id.length>20) return showMsg(m,"El usuario debe tener entre 3 y 20 letras o números, sin espacios.");
  if (p.length<6) return showMsg(m,"La contraseña debe tener al menos 6 caracteres.");
  if (p!==p2) return showMsg(m,"Las contraseñas no coinciden.");
  if (!$("#r-ok").checked) return showMsg(m,"Debes aceptar el tratamiento de datos para crear la cuenta.");
  const b=$("#r-btn"); b.disabled=true; b.textContent="Creando cuenta…";
  try{
    if (await leerUsuario(id)) { showMsg(m,"Ese usuario ya existe. Elige otro o inicia sesión."); return; }
    const s=salt();
    const u={id,usuario:id,nombre,grado:+$("#r-grado").value,institucion:$("#r-inst").value.trim(),salt:s,hash:await sha256(s+":"+p),
      creado:new Date().toISOString(),puntos:0,insignias:[],retos:0,temasVistos:[],progreso:{mat:{ok:0,n:0},fis:{ok:0,n:0},lec:{ok:0,n:0},soc:{ok:0,n:0}},simulacros:[]};
    const origen = await guardarUsuario(u,"auto");
    iniciarSesion(u,origen);
    toast(origen==="nube" ? "Cuenta creada y guardada en la base de datos" : "Cuenta creada y guardada en este dispositivo");
  }catch(err){ showMsg(m,"No se pudo crear la cuenta. Revisa tu conexión e inténtalo otra vez."); }
  finally{ b.disabled=false; b.textContent="Crear mi cuenta"; }
});

$("#f-login").addEventListener("submit", async e => {
  e.preventDefault(); const m=$("#l-msg"); m.hidden=true;
  const id=normUser($("#l-user").value), p=$("#l-pass").value;
  if (!id||!p) return showMsg(m,"Escribe tu usuario y contraseña.");
  const b=$("#l-btn"); b.disabled=true; b.textContent="Verificando…";
  try{
    const r = await leerUsuario(id);
    if (!r || (await sha256(r.u.salt+":"+p))!==r.u.hash) return showMsg(m,"Usuario o contraseña incorrectos.");
    iniciarSesion(r.u,r.origen);
  } finally { b.disabled=false; b.textContent="Entrar"; }
});

  <p class="muted">Elige un área y un nivel. Cada respuesta correcta suma 10 puntos y ves la explicación al instante.</p>

  <div class="grid2">${Object.entries(AREAS).map(([k,v])=>{const p=S.user.progreso[k];return `<button class="tile" data-reto="${k}"><span class="ic" style="background:${v.c}">${svg(v.ic,21)}</span><strong>${v.n}</strong><span class="small muted mono">${p.ok}/${p.n} aciertos</span></button>`}).join("")}</div>

  <button class="btn block green" data-act="tutor">Crear reto nuevo con el tutor IA</button>`;
}
function mezclar(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepQ(q){const idx=mezclar(q.o.map((_,i)=>i));return {...q,o:idx.map(i=>q.o[i]),c:idx.indexOf(q.c)}}
function iniciarReto(area,nivel,preguntas){
  let pool;
  if (preguntas) pool=preguntas;
  else { const exactas=BANCO.filter(q=>q.a===area&&q.g===nivel), otras=BANCO.filter(q=>q.a===area&&q.g!==nivel&&q.g<=nivel); pool=[...mezclar(exactas),...mezclar(otras)].slice(0,5); if(pool.length<5) pool=[...pool,...mezclar(BANCO.filter(q=>q.a===area&&!pool.includes(q)))].slice(0,5); }
  S.quiz={area,nivel,qs:pool.map(prepQ),i:0,sel:null,ok:0,ia:!!preguntas}; go("quiz");
}
function vQuiz(){
  const z=S.quiz; if(!z) return vRetos();
  if (z.i>=z.qs.length) return vQuizFin();
  const q=z.qs[z.i], answered=z.sel!==null;
  return `
  <div class="qhead"><span class="label">${AREAS[q.a]?.n||"Reto"}${z.ia?" · creado con IA":""}</span><span class="mono small">${z.i+1} / ${z.qs.length}</span></div>
  <div class="bar light"><i style="width:${(z.i/z.qs.length)*100}%"></i></div>
  <article class="card stack pop">
    ${q.ctx?`<div class="ctx">${esc(q.ctx)}</div>`:""}
    <h3>${esc(q.q)}</h3>
    <div class="opts">${q.o.map((o,i)=>{let cl="opt";if(answered){if(i===q.c)cl+=" right";else if(i===z.sel)cl+=" wrong"}return `<button class="${cl}" data-op="${i}" ${answered?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`}).join("")}</div>
    ${answered?`<div class="fb ${z.sel===q.c?"ok":"bad"}"><b>${z.sel===q.c?"¡Correcto! +10 pts":"Respuesta incorrecta"}</b><p>${esc(q.e)}</p></div><button class="btn block" data-act="sig">${z.i+1<z.qs.length?"Siguiente":"Ver resultado"}</button>`:""}
  </article>`;
}
function vQuizFin(){
  const z=S.quiz; return `
  <article class="card stack pop" style="text-align:center">
    <span class="label">Reto terminado</span>
    <h1 class="mono">${z.ok} / ${z.qs.length}</h1>
    <p>Ganaste <b class="mono">${z.ok*10}</b> puntos${z.nuevas?.length?`, y desbloqueaste: <b>${z.nuevas.map(id=>INSIGNIAS.find(b=>b.id===id).n).join(", ")}</b>`:""}.</p>
    <div class="grid2"><button class="btn" data-act="otra">Otro reto</button><button class="btn ghost" data-act="perfil">Ver mi progreso</button></div>
  </article>`;
}
function cerrarReto(){
  const z=S.quiz,u=S.user; u.retos=(u.retos||0)+1; 
  z.nuevas=revisarInsignias({perfecto:z.ok===z.qs.length&&z.qs.length>=5}); persistir();
}
function revisarInsignias(ev={}){
  const u=S.user, tiene=new Set(u.insignias), nuevas=[];
  const add=id=>{if(!tiene.has(id)){tiene.add(id);nuevas.push(id)}};
  if(u.retos>=1)add("primer"); if(ev.perfecto)add("perfecto"); if(u.simulacros.length)add("simulacro");
  if(u.retos>=5)add("constante"); if(u.temasVistos.length>=5)add("explorador");
  ["mat","fis","lec","soc"].forEach(a=>{if(u.progreso[a].ok>=10)add(a)});
  u.insignias=[...tiene]; if(nuevas.length) toast("Nueva insignia: "+nuevas.map(id=>INSIGNIAS.find(b=>b.id===id).n).join(", "));
  return nuevas;
}

/* ---------------- VISTA: SIMULACRO ---------------- */
function iniciarSim(){
  const qs=["lec","mat","soc","fis"].flatMap(a=>mezclar(BANCO.filter(q=>q.a===a)).slice(0,5)).map(prepQ);
  S.sim={qs,resp:Array(qs.length).fill(null),i:0,fin:Date.now()+30*60*1000,terminado:false};
  S.sim.timer=setInterval(tick,1000); go("sim");
}
function tick(){ const s=S.sim; if(!s||s.terminado) return; const left=s.fin-Date.now(); const el=$("#sim-t"); if(el){el.textContent=fmt(left);el.classList.toggle("low",left<5*60*1000)} if(left<=0) terminarSim(); }
const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")};
function vSim(){
  const s=S.sim; if(!s) return vRetos(); if(s.terminado) return vSimFin();
  const q=s.qs[s.i];
  return `
  <div class="qhead"><h2>Simulacro ICFES</h2><span id="sim-t" class="timer">${fmt(s.fin-Date.now())}</span></div>
  <div class="qnav" aria-label="Preguntas">${s.qs.map((_,i)=>`<button data-qi="${i}" class="${i===s.i?"cur":s.resp[i]!==null?"done":""}">${i+1}</button>`).join("")}</div>
  <article class="card stack">
    <span class="label">${AREAS[q.a].n} · Pregunta ${s.i+1}</span>
    ${q.ctx?`<div class="ctx">${esc(q.ctx)}</div>`:""}
    <h3>${esc(q.q)}</h3>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt ${s.resp[s.i]===i?"sel":""}" data-sop="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
  </article>
  <div class="grid2"><button class="btn ghost" data-act="sprev" ${s.i===0?"disabled":""}>Anterior</button>${s.i<s.qs.length-1?'<button class="btn" data-act="snext">Siguiente</button>':'<button class="btn red" data-act="sfin">Terminar</button>'}</div>
  <p class="small muted">Respondidas: <span class="mono">${s.resp.filter(r=>r!==null).length}/${s.qs.length}</span>. La retroalimentación aparece al terminar, como en el examen real.</p>`;
}
function terminarSim(){
  const s=S.sim; if(s.terminado) return; s.terminado=true; clearInterval(s.timer);
  const u=S.user; let ok=0; const porArea={};
  s.qs.forEach((q,i)=>{const bien=s.resp[i]===q.c; if(bien) ok++; porArea[q.a]=porArea[q.a]||{ok:0,n:0}; porArea[q.a].n++; if(bien)porArea[q.a].ok++; u.progreso[q.a].n++; if(bien)u.progreso[q.a].ok++;});
  s.ok=ok; s.porArea=porArea; s.puntaje=Math.round(ok/s.qs.length*500);
  u.puntos+=ok*10+20; u.simulacros=[...u.simulacros,{fecha:new Date().toISOString(),ok,total:s.qs.length,puntaje:s.puntaje}].slice(-10);
  s.nuevas=revisarInsignias(); persistir(); if(S.view==="sim") render();
}
function vSimFin(){
  const s=S.sim; return `
  <article class="card stack pop">
    <span class="label">Resultado del simulacro</span>
    <div class="statrow">
      <div class="stat"><span class="small muted">Aciertos</span><b>${s.ok}/${s.qs.length}</b></div>
      <div class="stat"><span class="small muted">Puntaje estimado</span><b>${s.puntaje}</b></div>
      <div class="stat"><span class="small muted">Puntos ganados</span><b>+${s.ok*10+20}</b></div>
    </div>
    <p class="small muted">El puntaje estimado escala tus aciertos a 0–500, como el puntaje global del Saber 11. Es una referencia, no un resultado oficial.</p>
    ${Object.entries(s.porArea).map(([a,v])=>`<div class="arow"><span>${AREAS[a].n.split(" ")[0]}</span><div class="bar light"><i style="width:${v.ok/v.n*100}%"></i></div><span class="mono small">${v.ok}/${v.n}</span></div>`).join("")}
  </article>
  <details class="card"><summary>Revisar respuestas y explicaciones</summary>
    <div class="stack" style="margin-top:12px">${s.qs.map((q,i)=>{const bien=s.resp[i]===q.c;return `<div class="fb ${bien?"ok":"bad"}"><b>${i+1}. ${bien?"Correcta":"Incorrecta"}</b><p>${esc(q.q)}</p><p><b>Respuesta:</b> ${esc(q.o[q.c])}</p><p>${esc(q.e)}</p></div>`}).join("")}</div>
  </details>
  <div class="grid2"><button class="btn" data-act="sim">Nuevo simulacro</button><button class="btn ghost" data-act="perfil">Mi progreso</button></div>`;
}

async function pintarRanking(){
  const box=$("#rank-home"); if(!box) return; let lista=[];
  const db=await dbReady;
  if(db){ try{ const s=await db.collection("usuarios").orderBy("puntos","desc").limit(10).get(); lista=s.docs.map(d=>d.data()); }catch(e){} }
  Object.values(LS.get("eduplay_usuarios",{})).forEach(u=>{if(!lista.some(x=>x.id===u.id))lista.push(u)});
  if(!lista.some(x=>x.id===S.user.id)) lista.push(S.user);

  const corto=n=>{const p=String(n).split(" ");return p[0]+(p[1]?" "+p[1][0]+".":"")};

  $("#rank-home").innerHTML=`<ol>${lista.map((u,i)=>`<li class="${u.id===S.user.id?"me":""}"><span class="pos">${i+1}</span><span>${esc(corto(u.nombre))} <span class="small muted">· ${u.grado}°</span></span><span class="mono">${u.puntos}</span></li>`).join("")}</ol>`;

  },
  biblioteca(){
    acts(); pintarRecursos();
    document.querySelectorAll("[data-tipo]").forEach(b=>b.onclick=()=>{S.bib.tipo=b.dataset.tipo;render()});
    const tipo=$("#rc-tipo"); tipo.onchange=()=>{const e=tipo.value==="enlace";$("#rc-url-f").hidden=!e;$("#rc-file-f").hidden=e};
    $("#f-rec").addEventListener("submit",async e=>{
      e.preventDefault(); const m=$("#rc-msg"); m.hidden=true;
      const tp=tipo.value, tit=$("#rc-tit").value.trim();
      if(!S.db) return showMsg(m,"La biblioteca necesita la base de datos. Configura Firebase en js/config.js.");
      if(tit.length<3) return showMsg(m,"Escribe un título de al menos 3 letras.");
      const doc={tipo:tp,titulo:tit,area:$("#rc-area").value,descripcion:$("#rc-desc").value.trim(),autor:S.user.nombre.split(" ")[0],creado:new Date().toISOString()};
      const btn=$("#rc-btn"); btn.disabled=true; btn.textContent="Guardando…";
      try{
        if(tp==="enlace"){ const u=$("#rc-url").value.trim(); if(!/^https?:\/\/\S+\.\S+/.test(u)) { showMsg(m,"Escribe una dirección que empiece por https://"); return; } doc.url=u; }
        else { const f=$("#rc-file").files[0]; if(!f){showMsg(m,"Elige el archivo que quieres subir.");return;} if(f.size>20*1024*1024){showMsg(m,"El archivo pesa más de 20 MB. Comprímelo o elige otro.");return;}
          if(tp==="foto"&&!f.type.startsWith("image/")){showMsg(m,"Ese archivo no es una imagen.");return;} if(tp==="video"&&!f.type.startsWith("video/")){showMsg(m,"Ese archivo no es un video.");return;}
          const up=await S.assets.upload(f); doc.url=up.url; doc.assetId=up.id; }
        await S.db.collection("recursos").add(doc);
        $("#f-rec").reset(); $("#rc-url-f").hidden=false; $("#rc-file-f").hidden=true; showMsg(m,"Guardado en la biblioteca.","ok");
      }catch(err){ showMsg(m, err?.code==="permission_denied"||err?.code==="not_granted" ? "No tienes permiso para agregar elementos. Revisa las reglas de Firebase." : "No se pudo guardar. Revisa tu conexión e inténtalo otra vez."); }
      finally{ btn.disabled=false; btn.textContent="Guardar en la biblioteca"; }
    });
  }
};
function acts(){
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="reto-rapido") iniciarReto(["mat","fis","lec","soc"][Math.floor(Math.random()*4)],S.user.grado);
    else if(a==="sim"){ if(S.sim&&!S.sim.terminado){go("sim")} else iniciarSim(); }
    else if(a==="tutor"){ S.tutorPre=""; go("tutor"); }
    else if(a==="tutor-tema"){ const t=TEMAS.find(x=>x.t===S.aprender.tema); S.aprender.a=t.a; S.tutorPre="Explícame "+t.t+" con un ejemplo tipo ICFES"; go("tutor"); }
    else if(a==="aprender") go("aprender");
    else if(a==="volver-temas"){ S.aprender.tema=null; render(); }
    else if(a==="volver-ini") go("inicio");
    else if(a==="reto-area"){ const t=TEMAS.find(x=>x.t===S.aprender.tema); iniciarReto(t.a,t.g); }
    else if(a==="otra"||a==="retos") go("retos");
    else if(a==="perfil") go("perfil");
    else if(a==="salir") cerrarSesion();
    else if(a==="sprev"){ S.sim.i--; render(); }
    else if(a==="snext"){ S.sim.i++; render(); }
    else if(a==="sfin"){ const sin=S.sim.resp.filter(r=>r===null).length; if(sin && !b.dataset.confirm){ b.dataset.confirm="1"; b.textContent=`Quedan ${sin} sin responder · tocar otra vez`; return; } terminarSim(); render(); }
  });
}

/* ---------------- FONDO ANIMADO DEL LOGIN ---------------- */
let fxRAF=null;
function startFx(){
  const cv=$("#bgfx"); if(!cv) return; const ctx=cv.getContext("2d"); const sy=["π","√","x²","∑","Δ","F=ma","A","B","C","D","★","+","÷","%","λ","∫"];
  const cols=["#4D92F0","#6CC248","#F2B400","#E0352B","#FFFFFF"];
  let W,H,P=[]; const fit=()=>{const r=cv.getBoundingClientRect();W=cv.width=r.width*devicePixelRatio;H=cv.height=r.height*devicePixelRatio;P=Array.from({length:Math.min(46,Math.round(W*H/52000))},()=>({x:Math.random()*W,y:Math.random()*H,s:(14+Math.random()*22)*devicePixelRatio,v:(.15+Math.random()*.35)*devicePixelRatio,t:sy[Math.floor(Math.random()*sy.length)],c:cols[Math.floor(Math.random()*cols.length)],a:.15+Math.random()*.35}))};
  fit(); addEventListener("resize",fit);
  const red=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const draw=()=>{ctx.clearRect(0,0,W,H);P.forEach(p=>{ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.font=`600 ${p.s}px Fredoka, sans-serif`;ctx.fillText(p.t,p.x,p.y);if(!red){p.y-=p.v;if(p.y<-40){p.y=H+20;p.x=Math.random()*W}}});if(!red)fxRAF=requestAnimationFrame(draw)};
  cancelAnimationFrame(fxRAF); draw();
}
function stopFx(){ cancelAnimationFrame(fxRAF); fxRAF=null; }
startFx();
</script>
